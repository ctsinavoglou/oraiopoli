<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Modern book/flipbook logo -->
  <rect width="100" height="100" rx="20" fill="url(#gradient)"/>
  <defs>
    <linearGradient id="gradient" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
  </defs>

  <!-- Book pages -->
  <path d="M25 30 L50 30 L50 75 L25 75 Z" fill="white" opacity="0.9"/>
  <path d="M50 30 L75 30 L75 75 L50 75 Z" fill="white" opacity="0.7"/>

  <!-- Book spine -->
  <rect x="48" y="30" width="4" height="45" fill="#1E293B"/>

  <!-- Page lines -->
  <line x1="30" y1="40" x2="45" y2="40" stroke="#4F46E5" stroke-width="2" stroke-linecap="round"/>
  <line x1="30" y1="48" x2="45" y2="48" stroke="#4F46E5" stroke-width="2" stroke-linecap="round"/>
  <line x1="30" y1="56" x2="42" y2="56" stroke="#4F46E5" stroke-width="2" stroke-linecap="round"/>

  <line x1="55" y1="40" x2="70" y2="40" stroke="#EC4899" stroke-width="2" stroke-linecap="round"/>
  <line x1="55" y1="48" x2="70" y2="48" stroke="#EC4899" stroke-width="2" stroke-linecap="round"/>
  <line x1="55" y1="56" x2="68" y2="56" stroke="#EC4899" stroke-width="2" stroke-linecap="round"/>
</svg>

