server:
  port: 8080
  address: 0.0.0.0

spring:
  application:
    name: oraiopoli-supermarket
  datasource:
    url: jdbc:postgresql://localhost:5432/oraiopoli
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: always
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false
    defer-datasource-initialization: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

application:
  security:
    jwt:
      secret-key: "b3JhaW9wb2xpLXN1cGVybWFya2V0LXNlY3JldC1rZXktbXVzdC1iZS1hdC1sZWFzdC0yNTYtYml0cy1sb25nLWZvci1oczI1Ni1hbGdvcml0aG0="
      access-token-expiration: 86400000   # 24 hours
      refresh-token-expiration: 604800000 # 7 days

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

logging:
  level:
    com.oraiopoli.supermarket: DEBUG
    org.springframework.security: INFO

